# Every push and pull request runs the full quality gate in the cloud.
# Vercel deploys every push itself (previews, and main to production); see README "Deploying".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  dashboard:
    name: Dashboard lint, types, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartstock-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smartstock-nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: smartstock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The real image: /health answers, the dashboard is gzipped, hashed assets are CDN-cacheable, mutations aren't
      - name: Smoke test the image
        run: |
          docker run -d --name smartstock -p 8000:8000 -e PRETRAIN_MODELS=0 -e REFRESH_ON_STARTUP=0 smartstock:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS -o page.html -D page.txt -H 'Accept-Encoding: gzip' --compressed http://localhost:8000/
          grep -qi '^content-encoding: gzip' page.txt
          grep -qi '^cache-control: public, max-age=0, must-revalidate' page.txt
          asset=$(python3 -c "import re; print(re.search(r'/_next/static/[^\"]+?\.js', open('page.html').read()).group(0))")
          curl -fsS -o /dev/null -D asset.txt "http://localhost:8000$asset"
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset.txt
          curl -fsS -o /dev/null -D post.txt -X POST -H 'Content-Type: application/json' \
            -d '{"ingredient":"Tomatoes","current_stock":20,"daily_usage":5,"max_capacity":100}' \
            http://localhost:8000/api/inventory/update
          grep -qi '^cache-control: no-store' post.txt
      - name: Container logs
        if: failure()
        run: docker logs smartstock || true
