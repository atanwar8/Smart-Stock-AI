# docker compose up --build  →  http://localhost:8000
services:
  smartstock:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1} # uvicorn workers; 1 until inventory/alerts move to the shared store
