# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from the README button, or Render Dashboard → New → Blueprint → this repo.
services:
  - type: web
    name: smartstock-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after 15 idle minutes (~1 min to wake); "starter" stays awake
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy main only after GitHub CI passes
    envVars:
      - key: MARS_API_KEY
        sync: false # free USDA MyMarketNews key; Data refresh needs it
      - key: OPENWEATHER_API_KEY
        sync: false # set in the dashboard; without it the app uses sample weather
      - key: SEED_DEMO_INVENTORY
        value: "1"
      - key: PRETRAIN_MODELS
        value: "1"
