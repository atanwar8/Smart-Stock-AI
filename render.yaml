# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from the README button, or Render Dashboard → New → Blueprint → this repo.
services:
  - type: web
    name: smartstock-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after 15 idle minutes (~1 min to wake); "starter" stays awake
    healthCheckPath: /health # in-memory counters only, so the load balancer's probe never waits on model work
    autoDeployTrigger: checksPass # deploy main only after GitHub CI passes
    envVars:
      - key: MARS_API_KEY
        sync: false # free USDA MyMarketNews key; Data refresh needs it
      - key: SUPABASE_DB_URL
        sync: false # Supabase *pooler* connection string (Render has no IPv6); without it a local SQLite store is used
      - key: SEED_DEMO_INVENTORY
        value: "1"
      - key: PRETRAIN_MODELS
        value: "1"
      # uvicorn worker processes behind Render's load balancer. Keep 1: inventory, alerts and trained models
      # are per-process memory today, so more workers (or instances) would each show different stock.
      - key: WEB_CONCURRENCY
        value: "1"
